name: Windows build & test

# CI verifies: the test suite on Windows, every bundled character asset, the PyInstaller build and a
# self-test of the built FocusBuddy.exe (loads + renders every character offscreen).
# CI does NOT verify real GPU hardware: hosted runners have no GPU, so 3D renders through software
# OpenGL or the CPU path. See README -> "Verification status".

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      FOCUSBUDDY_FAKE_HOUR: "14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (includes the real Win32 backend test)
        run: python -m pytest -q
      - name: Validate character assets
        run: python -m tools.validate_asset --all
      - name: Build exe
        run: pyinstaller --noconfirm focusbuddy.spec
      - name: Check the build contains the character assets
        shell: pwsh
        run: |
          $glb = Get-ChildItem -Recurse dist/FocusBuddy -Filter model.glb
          Write-Host "GLB files in the build: $($glb.Count)"
          if ($glb.Count -lt 8) { throw "character GLBs missing from the build" }
      - name: Self-test the built exe (fresh process, no Python on its path)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist/FocusBuddy/FocusBuddy.exe -ArgumentList "--self-test","--self-test-report","selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - name: Zip browser extension
        run: Compress-Archive -Path browser_extension\* -DestinationPath dist\FocusBuddy-extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FocusBuddy-windows
          path: |
            dist/FocusBuddy
            dist/FocusBuddy-extension.zip
            selftest.json

  linux-gl:
    # Exercises the OpenGL paths (GPU skinning vs CPU skinning parity) with Mesa's software renderer.
    runs-on: ubuntu-latest
    env:
      FOCUSBUDDY_FAKE_HOUR: "14"
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: System packages (X server, Mesa, Qt xcb deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests under Xvfb (software OpenGL)
        run: xvfb-run -a python -m pytest -q
      - name: Validate character assets
        run: python -m tools.validate_asset --all
