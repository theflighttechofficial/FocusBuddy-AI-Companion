<!doctype html>
<html>
<head>

  <title>Back to focus</title>
  <style>
    html, body { height: 100%; margin: 0; }

           background: radial-gradient(circle at 30% 20%, #ECEEFF, #F4F6FB 60%); }

  </style>
</head>

  <div class="card">
    <img src="icons/icon128.png" alt="">
